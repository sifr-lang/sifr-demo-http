[package]
name = "sifr-demo-http"
version = "0.1.0"
edition = "2024"
include = [
  "Cargo.toml",
  "Cargo.lock",
  "sifr.toml",
  "src/**/*.sifr",
  "src/**/*.rs",
  "README.md",
  "LICENSE"
]

# sifr-managed
[package.metadata.sifr]
manifest = "sifr.toml"
# end sifr-managed

[dependencies]
sifr-demo-json = { path = "../sifr-demo-json" }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[workspace]
